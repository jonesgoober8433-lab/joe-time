<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>喬時間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3EA;--card:#FFFDF8;--tx:#2B2F2C;--tx2:#6B6F68;--bd:#E3DCCB;--ac:#2F4F3E;--acd:#24402F;--acbg:#E4EBE2;--gold:#A98A4F;--wk:#F3EAD3;--wkbd:#E3D3AB;--wktx:#8A6A2B;--ok:#2F6B47;--okbg:#E1ECDD;--bad:#A33B2F;--badbg:#F6E3DF;--warn:#8A6A2B;--warnbg:#F4EAD0;--sh:0 1px 2px rgba(43,47,44,.06),0 4px 14px rgba(43,47,44,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Noto Sans TC","PingFang TC",-apple-system,"Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:20px 16px 120px}
.narrow{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}
.top .brand{margin:0;text-decoration:none}
a.ico{font-size:14px;color:var(--ac);text-decoration:none;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:500;white-space:nowrap}
a.ico:hover{border-color:var(--ac)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ac);font-size:15px;letter-spacing:.04em;margin:0 0 14px}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold)}
h1{font-size:26px;line-height:1.3;margin:4px 0 4px;font-weight:700;color:var(--acd)}
h2{font-size:18px;margin:0 0 10px;font-weight:700;color:var(--acd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:var(--sh)}
.sub{font-size:14px;color:var(--tx2)}
label.l{display:block;font-size:15px;font-weight:500;color:var(--tx);margin:20px 0 8px}
label.l:first-child{margin-top:0}
label.l small{font-weight:400;color:var(--tx2);font-size:13px;margin-left:6px}
input,select,button{font:inherit;color:var(--tx)}
input[type=text],input[type=time],input[type=number]{width:100%;height:48px;padding:0 14px;border:1px solid var(--bd);border-radius:12px;background:#fff}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{min-height:46px;padding:0 16px;border:1px solid var(--bd);border-radius:12px;background:var(--card);cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700;width:100%;margin-top:14px;min-height:52px;font-size:17px;box-shadow:0 2px 8px rgba(47,79,62,.25)}
button.p:hover{background:var(--acd)}
button.s{min-height:38px;padding:0 12px;font-size:14px}
button.d{color:var(--bad);border-color:#E7C3BD}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;border-radius:999px;padding:0 16px;font-size:15px}
.chip.on{background:var(--acbg);color:var(--ac);border-color:var(--ac);font-weight:700}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:13px;padding:3px 11px;border-radius:999px;margin:0 6px 6px 0}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}
.item{padding:12px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:none}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:4px}
.banner{font-size:14px;padding:10px 14px;border-radius:12px;background:var(--warnbg);color:var(--warn);margin:10px 0}
.stp{width:42px;padding:0;font-size:18px}
.cnt{min-width:28px;text-align:center;font-weight:700}
.link{word-break:break-all;font-size:14px;background:#fff;border:1px dashed var(--bd);border-radius:10px;padding:10px 12px;margin:6px 0}
.pin{min-height:38px;width:42px;padding:0;font-size:16px}
.pin.off{opacity:.3}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wh{text-align:center;font-size:13px;color:var(--tx2);padding:2px 0}
.wh.we{color:var(--wktx);font-weight:700}
.day{min-height:54px;padding:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:17px;background:#fff}
.day small{font-size:11px;color:var(--tx2);min-height:13px}
.day.we{background:var(--wk);border-color:var(--wkbd)}
.day.we small{color:var(--wktx)}
.day.today{box-shadow:inset 0 0 0 2px var(--gold)}
.day.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.day.on small{color:#DCE6DA}
.day:disabled{opacity:.3;cursor:default;background:transparent;border-style:dashed}
.legend{display:flex;gap:14px;font-size:13px;color:var(--tx2);margin:10px 0 0;align-items:center;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1px solid var(--bd);background:#fff}
.legend .w::before{background:var(--wk);border-color:var(--wkbd)}
.legend .s::before{background:var(--ac);border-color:var(--ac)}
.picked{margin-top:12px;font-size:14px;color:var(--ac);font-weight:500}
/* advanced */
.adv{background:none;border:none;width:100%;min-height:48px;padding:0;display:flex;justify-content:space-between;align-items:center;font-weight:500;color:var(--acd)}
.adv .sub{font-weight:400}
.adv-body{border-top:1px solid var(--bd);margin-top:12px;padding-top:6px}
/* sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(247,243,234,0),var(--bg) 22%);padding:22px 16px calc(14px + env(safe-area-inset-bottom));z-index:5}
.bar>div{max-width:560px;margin:0 auto}
.bar .err{margin:0 0 6px;text-align:center;min-height:0}
.bar button.p{margin-top:0}
/* steps / hero / share */
.steps{display:flex;gap:10px;margin:14px 0 4px;padding:0;list-style:none}
.steps li{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 10px;text-align:center;font-size:14px;line-height:1.4}
.steps b{display:flex;margin:0 auto 6px;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;align-items:center;justify-content:center;font-size:14px}
.num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-right:8px}
.hero{background:var(--ac);color:#F7F3EA;border-radius:18px;padding:20px;margin:14px 0;box-shadow:var(--sh)}
.hero .k{font-size:13px;letter-spacing:.08em;color:#CBD8C9}
.hero .big{font-size:24px;font-weight:700;line-height:1.35;margin:2px 0 6px}
.hero .meter{height:8px;border-radius:99px;background:rgba(247,243,234,.25);overflow:hidden;margin:10px 0 6px}
.hero .meter i{display:block;height:100%;background:#E3C98C;border-radius:99px}
.hero .tag{display:inline-block;background:#E3C98C;color:#3b2f10;border-radius:999px;font-size:13px;font-weight:700;padding:2px 12px;margin-top:4px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--ac);border-radius:12px;color:var(--ac);font-weight:700;text-decoration:none;background:var(--card);text-align:center}
a.btn:hover{background:var(--acbg)}
.share-main{border:2px solid var(--ac)}
.copy{width:100%;margin-top:6px}
.lead{font-size:16px;color:var(--tx2);margin:0 0 4px}
.ghost{width:100%;margin-top:10px}
@media (min-width:720px){#app{padding-top:36px}h1{font-size:30px}}
</style>
</head>
<body>
<div id="app">載入中…</div>
<script src="config.js"></script>
<script type="module">
const DEL = Symbol('del');
const cfg = window.FIREBASE_CONFIG;
const LOCAL = !cfg;
let db;
let auth = null, AU = null, user = null, authMsg = '';

if (cfg) {
  const A = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const F = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const app0 = A.initializeApp(cfg);
  const f = F.getFirestore(app0);
  try { AU = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'); auth = AU.getAuth(app0); auth.languageCode = 'zh-TW'; } catch (e) { AU = null; auth = null; }
  const ref = id => F.doc(f, 'events', id);
  db = {
    mineList: async uid => (await F.getDocs(F.collection(f, 'users', uid, 'events'))).docs.map(x => x.data()),
    minePut: (uid, rec) => F.setDoc(F.doc(f, 'users', uid, 'events', rec.id), rec),
    create: (id, d) => F.setDoc(ref(id), d),
    sub: (id, cb) => F.onSnapshot(ref(id), s => cb(s.exists() ? s.data() : null)),
    patch: (id, ops) => {
      const o = {};
      for (const k in ops) o[k] = ops[k] === DEL ? F.deleteField() : ops[k];
      return F.updateDoc(ref(id), o);
    }
  };
} else {
  const subs = {};
  const read = id => { try { return JSON.parse(localStorage.getItem('mrs:' + id)); } catch (e) { return null; } };
  const write = (id, d) => { localStorage.setItem('mrs:' + id, JSON.stringify(d)); (subs[id] || []).forEach(cb => cb(d)); };
  db = {
    mineList: async () => [], minePut: async () => { },
    create: async (id, d) => write(id, d),
    sub: (id, cb) => { (subs[id] = subs[id] || []).push(cb); cb(read(id)); return () => {}; },
    patch: async (id, ops) => {
      const d = read(id);
      for (const k in ops) {
        const p = k.split('.'); let o = d;
        for (let i = 0; i < p.length - 1; i++) o = o[p[i]] = o[p[i]] || {};
        if (ops[k] === DEL) delete o[p[p.length - 1]]; else o[p[p.length - 1]] = ops[k];
      }
      write(id, d);
    }
  };
}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = () => Math.random().toString(36).slice(2, 10);
const WK = ['日', '一', '二', '三', '四', '五', '六'];
const dlabel = d => { const [y, m, dd] = d.split('-').map(Number); return m + '/' + dd + '（' + WK[new Date(y, m - 1, dd).getDay()] + '）'; };
const tm = m => { m = m % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const toMin = v => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
const iso = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const base = () => location.href.split('#')[0];
const rng = r => tm(r.s) + '–' + tm(r.e);
const durL = v => { const h = Math.floor(v / 60), m = v % 60; return m ? (h ? h + ' 小時 ' + m + ' 分' : m + ' 分鐘') : h + ' 小時'; };

let route = {}, ev = null, unsub = null, form = null, msg = '', draft = null, adminOk = false, coreOk = false, aerr = '';
const save = ops => db.patch(route.id, ops);
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'e' && h[1]) return { v: 'member', id: h[1] };
  if (h[0] === 'c' && h[1] && h[2]) return { v: 'core', id: h[1], token: h[2] };
  if (h[0] === 'm' && h[1] && h[2]) return { v: 'admin', id: h[1], key: h[2] };
  if (h[0] === 'mine') return { v: 'mine' };
  return { v: 'new' };
}

/* ---- 我的活動（本機記憶 + 選填 email 備份）---- */
const MK = 'mrs-mine';
const getMine = () => { try { return JSON.parse(localStorage.getItem(MK)) || []; } catch (e) { return []; } };
const setMine = l => { try { localStorage.setItem(MK, JSON.stringify(l)); } catch (e) { } };
const clean = o => JSON.parse(JSON.stringify(o));
function mergeInto(l, rec) {
  const i = l.findIndex(x => x.id === rec.id);
  if (i < 0) { l.unshift(clean(rec)); return; }
  const old = l[i], role = old.role === 'admin' || rec.role === 'admin' ? 'admin' : 'member';
  l[i] = clean(Object.assign({}, old, rec, { role }));
}
const seen = new Set();
function rememberEvent(rec) {
  const l = getMine(); mergeInto(l, rec); setMine(l);
  if (user) db.minePut(user.uid, l.find(x => x.id === rec.id)).catch(() => { });
}
function trackEvent() {
  if (!ev || !route.id) return;
  let rec = null;
  if (isAdmin()) rec = { id: route.id, title: ev.title, role: 'admin', key: route.key, ct: getCt() || undefined };
  else if (myEntry()) rec = { id: route.id, title: ev.title, role: 'member', me: myId() };
  if (!rec) return;
  const k = JSON.stringify(rec); if (seen.has(k)) return; seen.add(k);
  rememberEvent(Object.assign({ at: Date.now() }, rec));
}
async function syncMine() {
  if (!user) return;
  try {
    const cloud = await db.mineList(user.uid), l = getMine();
    cloud.forEach(r => mergeInto(l, r));
    setMine(l);
    l.forEach(r => {
      try {
        if (r.me && !localStorage.getItem('mrs-me:' + r.id)) localStorage.setItem('mrs-me:' + r.id, r.me);
        if (r.ct && !localStorage.getItem('mrs-ct:' + r.id)) localStorage.setItem('mrs-ct:' + r.id, r.ct);
      } catch (e) { }
    });
    await Promise.all(l.map(r => db.minePut(user.uid, r)));
  } catch (e) { authMsg = '備份到雲端失敗（可能還沒完成後台設定）：' + (e.code || e.message); }
  if (route.v === 'mine') render();
}
async function sendLink(email) {
  if (!auth) return '目前是測試模式，無法寄信。';
  try {
    await AU.sendSignInLinkToEmail(auth, email, { url: location.origin + location.pathname, handleCodeInApp: true });
    try { localStorage.setItem('mrs-email', email); } catch (e) { }
    return '';
  } catch (e) { return '寄信失敗（' + (e.code || e.message) + '）。請確認 email，或稍後再試。'; }
}
const topbar = () => '<div class="top"><a class="brand" href="#/"><i></i>喬時間</a><a class="ico" href="#/mine" aria-label="我的活動">📋 我的活動</a></div>';

function mineHtml() {
  const l = getMine(), root = location.origin + location.pathname;
  const bad = /失敗|不對|過期/.test(authMsg);
  let h = '<div class="narrow">' + topbar() + '<h1>我的活動</h1><p class="lead">這台裝置上建立或報名過的活動，連結都在這裡。</p>';
  if (!l.length) h += '<div class="card"><p class="sub" style="margin:0">這台裝置還沒有活動。建立一個活動，或在朋友的連結報名後，就會出現在這裡。</p></div>';
  l.forEach(r => {
    const lk = (name, sub, u) => '<p class="sub" style="margin:12px 0 4px"><b>' + name + '</b>　' + sub + '</p><div class="link">' + esc(u) + '</div><div class="row"><button class="s grow" data-a="copy" data-t="' + esc(u) + '">複製</button><a class="btn s grow" style="min-height:38px;font-size:14px" href="' + esc(u) + '">開啟</a></div>';
    h += '<div class="card"><div class="row sp"><h2 style="margin:0">' + esc(r.title || '活動') + '</h2><span class="pill ' + (r.role === 'admin' ? 'ok' : 'warn') + '" style="margin:0">' + (r.role === 'admin' ? '主辦' : '參加者') + '</span></div>';
    if (r.role === 'admin') {
      h += lk('管理連結', '看結果、定案（只有你自己留著）', root + '#/m/' + r.id + '/' + r.key);
      if (r.ct) h += lk('必到專用連結', '先傳給一定要到的人', root + '#/c/' + r.id + '/' + r.ct);
      h += lk('一般連結', '開放後貼給其他人', root + '#/e/' + r.id);
    } else h += lk('活動連結', '看名單、修改我的時間', root + '#/e/' + r.id);
    h += '</div>';
  });
  h += '<div class="card"><h2>📧 換手機也想找回？用 email 備份</h2>';
  if (!auth) h += '<p class="sub" style="margin:0">目前是測試模式，不支援 email 找回。</p>';
  else if (user) h += '<p class="sub" style="margin-top:0">已用 <b>' + esc(user.email || '') + '</b> 驗證，上面的活動會自動備份。換手機再用這個 email 驗證，就能找回。</p><button class="s" data-a="logout">登出這台裝置</button>';
  else {
    let em = ''; try { em = localStorage.getItem('mrs-email') || ''; } catch (e) { }
    h += '<p class="sub" style="margin-top:0">上面只存在這台裝置。輸入 email，我們寄一封驗證信，點信裡的連結就能備份；之後在任何裝置驗證同一個 email，都能找回。不用密碼。</p><input type="text" id="mail" inputmode="email" autocomplete="email" placeholder="you@example.com" value="' + esc(em) + '"><button class="p" data-a="sendmail" style="min-height:48px;font-size:16px">寄驗證信</button>';
  }
  h += '<div class="err" id="mmsg" style="color:var(' + (bad ? '--bad' : '--ok') + ')">' + esc(authMsg) + '</div></div>';
  return h + '</div>';
}

function init() {
  if (unsub) { unsub(); unsub = null; }
  route = parseRoute(); ev = null; form = null; msg = ''; aerr = ''; adminOk = false; coreOk = false;
  if (route.v === 'new') { draft = draft || newDraft(); render(); return; }
  if (route.v === 'mine') { render(); return; }
  unsub = db.sub(route.id, async d => {
    ev = d;
    if (d && route.v === 'admin') adminOk = (await sha(route.key)) === d.adminHash;
    if (d && route.v === 'core') coreOk = (await sha(route.token)) === d.coreHash;
    if (!form) render(); else if (document.activeElement && /INPUT/.test(document.activeElement.tagName)) return; else render();
  });
}
window.addEventListener('hashchange', init);

function newDraft() {
  const days = [], t = new Date();
  const st = new Date(t.getFullYear(), t.getMonth(), t.getDate() - t.getDay());
  for (let i = 0; i < 35; i++) { const x = new Date(st); x.setDate(st.getDate() + i); days.push(iso(x)); }
  return { title: '', total: 4, dur: 90, days: days, pick: {}, slots: [], err: '', made: null, adv: false };
}

const isAdmin = () => route.v === 'admin' && !!ev && adminOk;
const myKey = () => 'mrs-me:' + route.id;
const myId = () => { try { return localStorage.getItem(myKey()); } catch (e) { return null; } };
const members = () => Object.entries((ev && ev.members) || {}).map(([id, m]) => Object.assign({ id }, m)).sort((a, b) => (a.at || 0) - (b.at || 0));
const winsFor = d => ((ev && ev.windows) || {})[d] || [];
const hasWins = () => !!ev && Object.keys(ev.windows || {}).length > 0;
const inWin = (d, r) => winsFor(d).some(w => r.s >= w.s && r.e <= w.e);
const sig = pins => JSON.stringify(pins.map(m => [m.id, m.avail || {}]).sort((a, b) => a[0] < b[0] ? -1 : 1));

function intersect(lists) {
  let cur = lists[0].map(x => ({ s: x.s, e: x.e }));
  for (let i = 1; i < lists.length; i++) {
    const nxt = [];
    for (const a of cur) for (const b of lists[i]) { const s = Math.max(a.s, b.s), e = Math.min(a.e, b.e); if (e > s) nxt.push({ s, e }); }
    cur = nxt;
  }
  return cur;
}

function computeWindows(pins) {
  const w = {};
  for (const d of ev.days) {
    const lists = pins.map(m => (m.avail || {})[d] || []);
    if (!lists.length || lists.some(l => !l.length)) continue;
    const r = intersect(lists).filter(x => x.e - x.s >= ev.dur);
    if (r.length) w[d] = r;
  }
  return w;
}

function calc(date) {
  const all = members(), mains = all.filter(m => m.st === 'main'), pins = all.filter(m => m.pin);
  const cover = (m, s) => ((m.avail || {})[date] || []).some(r => r.s <= s && r.e >= s + ev.dur);
  let best = null;
  for (let s = 360; s + ev.dur <= 1800; s += 10) {
    if (hasWins() && !winsFor(date).some(w => s >= w.s && s + ev.dur <= w.e)) continue;
    const set = mains.filter(m => cover(m, s));
    const miss = ev.slots.filter(sl => set.filter(m => (m.tags || []).includes(sl.n)).length < sl.c).map(sl => sl.n);
    const missPin = pins.filter(p => !cover(p, s)).map(p => p.gid);
    const score = set.length * 10 - miss.length * 3 - missPin.length * 100;
    if (!best || score > best.score) best = { s, set, miss, missPin, score, ok: set.length >= ev.total && !miss.length && !missPin.length };
  }
  return best || { s: 0, set: [], miss: [], missPin: [], score: -999, ok: false, none: true };
}

function coverage() {
  const main = members().filter(m => m.st === 'main');
  return ev.slots.map(sl => ({ n: sl.n, need: sl.c, c: main.filter(m => (m.tags || []).includes(sl.n)).length }));
}

function calHtml(d) {

    const [y, m, dd] = x.split('-').map(Number), wd = new Date(y, m - 1, dd).getDay();
    const past = x < today, we = wd === 0 || wd === 6;
    const mark = (dd === 1 || i === 0) ? m + '月' : '';
    h += '<button class="day' + (we ? ' we' : '') + (d.pick[x] ? ' on' : '') + (x === today ? ' today' : '') + '"' + (past ? ' disabled' : '') + ' data-a="day" data-d="' + x + '" aria-pressed="' + (d.pick[x] ? 'true' : 'false') + '" aria-label="' + dlabel(x) + '">' + dd + '<small>' + mark + '</small></button>';

  h += rosterHtml(admin);
  if (admin) h += timesHtml(admin) + '<div class="card"><h2>貼到群組</h2><button class="p" style="margin-top:0" data-a="group">複製名單與時段文字</button><div class="err" style="color:var(--ok)">' + esc(msg) + '</div></div>';
  app.innerHTML = h;
}

const getCt = () => { try { return localStorage.getItem('mrs-ct:' + route.id); } catch (e) { return null; } };
function linksCard() {
  const ct = getCt(), ue = base() + '#/e/' + route.id, uc = ct ? base() + '#/c/' + route.id + '/' + ct : '';
  let h = '<div class="card"><h2>連結</h2><p class="sub" style="margin:0 0 4px"><b>必到專用連結</b>　先只傳給必到的人</p>';
  if (uc) h += '<div class="link">' + esc(uc) + '</div><button class="s" data-a="copy" data-t="' + esc(uc) + '">複製必到連結</button>';
  else h += '<p class="sub">這台裝置沒有存必到連結。</p>';
  h += '<button class="s" data-a="regen" style="margin-left:6px">重新產生必到連結</button><p class="sub" style="margin:2px 0 0">重新產生後，舊的必到連結會失效。</p>';
  h += '<p class="sub" style="margin:14px 0 4px"><b>一般連結</b>　開放後再貼給其他人</p><div class="link">' + esc(ue) + '</div><button class="s" data-a="copy" data-t="' + esc(ue) + '">複製一般連結</button>';
  return h + '<div class="err" style="color:var(--ok)">' + esc(msg) + '</div></div>';
}

function openForm(mid) {
  const m = mid && ev.members && ev.members[mid];
  const mode = route.v === 'core' ? 'core' : isAdmin() ? 'admin' : 'gen';
  form = { mode, mid: mid || null, gid: m ? m.gid : '', tags: m ? (m.tags || []).slice() : [], avail: m ? JSON.parse(JSON.stringify(m.avail || {})) : {}, err: '' };
  render();
}

function saveForm() {
  const gid = ($('#gid').value || '').trim();
  const err = t => { form.err = t; $('#ferr').textContent = t; };
  if (!gid) return err('請輸入名字');
  const em1 = $('#email'), mail = em1 ? em1.value.trim() : '';
  if (mail && !/^\S+@\S+\.\S+$/.test(mail)) return err('email 格式不太對');
  if (members().some(m => m.id !== form.mid && m.gid.toLowerCase() === gid.toLowerCase())) return err('這個名字已經有人填了');
  const avail = {};
  for (const d in form.avail) {
    const rs = form.avail[d];
    for (const r of rs) {
      if (r.s == null || r.e == null || isNaN(r.s) || isNaN(r.e) || r.s === r.e) return err(dlabel(d) + ' 有一段時間沒填完整');
      if (form.mode === 'gen' && !inWin(d, r)) return err(dlabel(d) + ' ' + rng(r) + ' 超出可填的時間');
    }
    if (rs.length) avail[d] = rs;
  }
  if (form.mode !== 'admin' && !Object.keys(avail).length) return err('至少填一段有空的時間');
  const id = form.mid || rid();
  const old = ev.members && ev.members[id];
  const mainCount = members().filter(m => m.id !== id && m.st === 'main').length;
  const m = { gid, tags: form.tags, avail, st: old ? old.st : (form.mode === 'core' || mainCount < ev.total ? 'main' : 'wait'), group: old ? (old.group || 'gen') : (form.mode === 'core' ? 'core' : 'gen'), at: old ? old.at : Date.now() };
  if (old && old.pin) m.pin = true;
  if (!form.mid && !form.proxy) {
    try { localStorage.setItem(myKey(), id); } catch (e) { }
    rememberEvent({ id: route.id, title: ev.title, role: 'member', me: id, at: Date.now() });
    if (mail) sendLink(mail).then(r => { if (r) alert(r); else alert('已寄驗證信到 ' + mail + '。點信裡的連結，之後就能用 email 找回你的報名。'); });
  }
  form = null;
  save({ ['members.' + id]: m });
}

function lockAndOpen(open) {
  const pins = members().filter(m => m.pin);
  const fail = t => { aerr = t; const e = $('#aerr'); if (e) e.textContent = t; };
  if (!pins.length) return fail('先在名單上用 📌 釘選至少一位必到的人');
  const w = computeWindows(pins);
  if (!Object.keys(w).length) {
    const blockers = pins.filter(p => Object.keys(computeWindows(pins.filter(x => x.id !== p.id))).length > 0).map(p => p.gid);
    return fail('釘選的人沒有共同的 ' + ev.dur + ' 分鐘時間。' + (blockers.length ? '拿掉其中一位就有：' + blockers.join('、') : '需要拿掉不只一位，或請他們調整時間。'));
  }
  aerr = '';
  const ops = { windows: w, lockSig: sig(pins) };
  if (open) ops.phase = 'open';
  save(ops);
}

function groupText() {
  const ms = members(), main = ms.filter(m => m.st === 'main'), wait = ms.filter(m => m.st !== 'main');
  let t = '【' + ev.title + '】\n';
  t += ev.final ? '時間：' + dlabel(ev.final.date) + ' ' + tm(ev.final.s) + '–' + tm(ev.final.s + ev.dur) + '\n' : '時間：尚未定案\n';
  t += '名單：\n' + main.map(m => '・' + m.gid + (m.tags && m.tags.length ? '（' + m.tags.join('、') + '）' : '')).join('\n');
  if (wait.length) t += '\n候補：\n' + wait.map(m => '・' + m.gid).join('\n');
  return t;
}

async function copy(t) { try { await navigator.clipboard.writeText(t); return true; } catch (e) { return false; } }

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.a === 'rt' && form) {
    const r = form.avail[t.dataset.d][+t.dataset.i];
    r[t.dataset.k] = t.value ? toMin(t.value) : null;
    if (t.dataset.k === 'e' && r.s != null && r.e != null && r.e <= r.s) r.e += 1440;
  }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, D = b.dataset;
  if (route.v === 'mine') {
    if (a === 'copy') { const ok = await copy(D.t); b.textContent = ok ? '已複製 ✓' : '請長按手動複製'; }
    else if (a === 'sendmail') {
      const em = ($('#mail').value || '').trim(), box = $('#mmsg');
      if (!/^\S+@\S+\.\S+$/.test(em)) { box.style.color = 'var(--bad)'; box.textContent = 'email 格式不太對'; return; }
      box.style.color = 'var(--ok)'; box.textContent = '寄送中…';
      const r = await sendLink(em);
      authMsg = r || ('已寄驗證信到 ' + em + '，請到信箱點連結（沒看到請找垃圾信件匣）。'); render();
    } else if (a === 'logout') { try { await AU.signOut(auth); } catch (e) { } user = null; authMsg = '已登出。這台裝置上的活動仍會保留。'; render(); }
    return;
  }
  if (route.v === 'new') {
    const d = draft;
    if (a === 'adv') d.adv = !d.adv;
    else if (a === 'tot') d.total = Math.max(2, Math.min(12, d.total + +D.v));
    else if (a === 'dur') d.dur = +D.v;
    else if (a === 'day') {
      if (d.pick[D.d]) { delete d.pick[D.d]; d.err = ''; }
      else if (Object.keys(d.pick).length >= 14) d.err = '最多選 14 天，請先取消幾天再選';
      else { d.pick[D.d] = 1; d.err = ''; }
    }
    else if (a === 'sc') d.slots[+D.i].c = Math.max(1, Math.min(6, d.slots[+D.i].c + +D.v));
    else if (a === 'sdel') d.slots.splice(+D.i, 1);
    else if (a === 'sadd') { const n = ($('#sn').value || '').trim(); if (!n) d.err = '先輸入條件名稱'; else if (d.slots.some(s => s.n === n)) d.err = '這個條件已經有了'; else { d.slots.push({ n, c: 1 }); d.err = ''; } }
    else if (a === 'create') {
      d.title = ($('#title').value || '').trim();
      const em0 = $('#email'); d.email = em0 ? em0.value.trim() : '';
      d.err = '';
      const dc0 = $('#durc'); if (dc0 && dc0.value) { const v = Math.round(+dc0.value); if (v >= 15 && v <= 720) d.dur = v; else d.err = '預計時間請填 15–720 分鐘'; }
      const days = d.days.filter(x => d.pick[x]);
      if (d.err) { } else if (!d.title) d.err = '請輸入活動名稱'; else if (!days.length) d.err = '至少選一個候選日期'; else if (d.email && !/^\S+@\S+\.\S+$/.test(d.email)) d.err = 'email 格式不太對';
      else {
        d.err = ''; const id = rid() + rid(), key = rid() + rid(), ctoken = rid() + rid();
        await db.create(id, { title: d.title, total: d.total, dur: d.dur, days, slots: d.slots, phase: 'prep', windows: {}, lockSig: '', adminHash: await sha(key), coreHash: await sha(ctoken), members: {}, createdAt: Date.now(), expireAt: new Date(Date.now() + 14 * 864e5) });
        d.made = { id, key, ctoken };
        try { localStorage.setItem('mrs-ct:' + id, ctoken); } catch (e) { }
        rememberEvent({ id, title: d.title, role: 'admin', key, ct: ctoken, at: Date.now() });
        if (d.email) { d.mailMsg = '寄送中…'; sendLink(d.email).then(r => { d.mailMsg = r || ('已寄驗證信到 ' + d.email + '。請到信箱點信裡的連結，之後就能用這個 email 找回活動。'); if (route.v === 'new') render(); }); }
      }
    }
    else if (a === 'copy') { msg = (await copy(D.t)) ? '已複製' : '複製失敗，請長按連結手動複製'; }
    else if (a === 'open') { location.hash = '#/m/' + draft.made.id + '/' + draft.made.key; draft = null; return; }
    else if (a === 'again') draft = newDraft();
    { const t = $('#title'); if (t && a !== 'create') d.title = t.value; const e2 = $('#email'); if (e2 && a !== 'create') d.email = e2.value; const dc = $('#durc'); if (dc && dc.value && a !== 'create' && a !== 'dur') { const v = Math.round(+dc.value); if (v >= 15 && v <= 720) d.dur = v; } }
    render(); return;
  }
  if (!ev) return;
  const admin = isAdmin();
  if (a === 'join') openForm(myEntry() ? myId() : null);
  else if (admin && a === 'proxy') { openForm(null); form.proxy = true; }
  else if (admin && a === 'edit') openForm(D.id);
  else if (a === 'tag') { const g = $('#gid'); if (g) form.gid = g.value; const em = $('#email'); if (em) form.email = em.value; const i = form.tags.indexOf(D.n); if (i < 0) form.tags.push(D.n); else form.tags.splice(i, 1); render(); }
  else if (a === 'addr') { const g = $('#gid'); if (g) form.gid = g.value; const em = $('#email'); if (em) form.email = em.value; const w = winsFor(D.d)[0]; (form.avail[D.d] = form.avail[D.d] || []).push(form.mode === 'gen' && w ? { s: w.s, e: w.e } : { s: 540, e: 720 }); render(); }
  else if (a === 'delr') { const g = $('#gid'); if (g) form.gid = g.value; const em = $('#email'); if (em) form.email = em.value; form.avail[D.d].splice(+D.i, 1); render(); }
  else if (a === 'save') saveForm();
  else if (a === 'cancel') { form = null; render(); }
  else if (admin && a === 'pin') { const m = ev.members[D.id]; save({ ['members.' + D.id + '.pin']: !m.pin }); }
  else if (admin && a === 'lock') { lockAndOpen(D.o === '1'); render(); }
  else if (admin && a === 'pause') save({ phase: 'prep' });
  else if (admin && a === 'regen') { const t = rid() + rid(); try { localStorage.setItem('mrs-ct:' + route.id, t); } catch (e) { } save({ coreHash: await sha(t) }); msg = '已重新產生，舊連結失效'; render(); }
  else if (admin && a === 'mv') { const m = ev.members[D.id]; save({ ['members.' + D.id + '.st']: m.st === 'main' ? 'wait' : 'main' }); }
  else if (admin && a === 'del') { if (confirm('確定刪除 ' + ev.members[D.id].gid + '？')) save({ ['members.' + D.id]: DEL }); }
  else if (admin && a === 'final') save({ final: { date: D.d, s: +D.s } });
  else if (admin && a === 'group') { msg = (await copy(groupText())) ? '已複製，貼到群組即可' : '複製失敗'; render(); }
  else if (a === 'copy') { msg = (await copy(D.t)) ? '已複製' : '複製失敗'; render(); }
});

if (auth) {
  try {
    if (AU.isSignInWithEmailLink(auth, location.href)) {
      let em = ''; try { em = localStorage.getItem('mrs-email') || ''; } catch (e) { }
      if (!em) em = prompt('請輸入你收到驗證信的 email，完成驗證') || '';
      try { await AU.signInWithEmailLink(auth, em, location.href); authMsg = '驗證成功！你的活動已備份。'; }
      catch (e) { authMsg = '驗證失敗或連結已過期，請重新寄一封。'; }
      history.replaceState(null, '', location.origin + location.pathname + '#/mine');
    }
    try { await auth.authStateReady(); } catch (e) { }
    user = auth.currentUser;
    AU.onAuthStateChanged(auth, u => { user = u; if (u) syncMine(); });
  } catch (e) { }
}
init();
if (user) syncMine();
</script>
